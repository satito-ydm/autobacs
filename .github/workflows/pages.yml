name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: เตรียมโฟลเดอร์สำหรับ publish
        run: |
          rm -rf _site
          cp -r site _site
          rm -f _site/__*.html
          # index2.html คือหน้าแรกตัวจริง ส่วนของเดิมย้ายไปเป็น index-old.html
          mv _site/index.html _site/index-old.html
          cp _site/index2.html _site/index.html
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
